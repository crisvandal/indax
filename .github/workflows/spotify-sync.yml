name: Sync Spotify
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: spotify-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Spotify data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_MARKET: US
        run: python scripts/spotify_sync.py
      - name: Commit changes
        run: |
          git config user.name "spotify-sync"
          git config user.email "spotify-sync@users.noreply.github.com"
          git add spotify.json
          if git diff --cached --quiet; then
            echo "Без изменений"
          else
            git commit -m "Update Spotify data"
            git push
          fi
